name: Generate lane articles (Sqwod)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 2,5'   # Tue + Fri ~08:00–09:00 Berlin — a couple of fresh articles a week

permissions:
  contents: write

jobs:
  articles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Author lane articles (BUILD · SIGNAL · MOVE)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node automation/articles.mjs --lane=build  --days=5 || true
          node automation/articles.mjs --lane=signal --days=5 || true
          node automation/articles.mjs --lane=move   --days=5 || true

      - name: Hold new articles for Tee's one-tap approval (nothing publishes unreviewed)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.INTEL_FROM }}
          INTEL_REVIEWER_EMAIL: ${{ secrets.INTEL_REVIEWER_EMAIL }}
          INTEL_SIGNING_SECRET: ${{ secrets.INTEL_SIGNING_SECRET }}
          INTEL_WORKER_URL: ${{ vars.INTEL_WORKER_URL }}
        run: node automation/article-review.mjs --queue --date=$(date +%F)

      - name: Commit & push (if anything changed)
        run: |
          git config user.name "Sqwod Bot"
          git config user.email "bot@sqwod.life"
          git add site/src/content/articles
          for p in automation/article-drafts automation/intel-queue; do [ -e "$p" ] && git add "$p"; done
          if git diff --staged --quiet; then
            echo "No new articles this run."
          else
            git commit -m "articles: drafts held for approval $(date +%F)"
            git pull --rebase --autostash origin main || true
            git push
          fi
