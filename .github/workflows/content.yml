name: Generate content (Sqwod cascade)

on:
  workflow_dispatch:            # manual run from the Actions tab, AND the on-time trigger:
                                # the dash.sqwod.life Cloudflare Worker dispatches this at
                                # 05:00 UTC on weekdays, because GitHub's own schedule
                                # routinely starts 5-6 hours late (11:12, 11:43 in Oct 2026).
    inputs:
      force:
        description: 'Re-run even if today''s issue already exists (sends the email again)'
        type: boolean
        default: false
  schedule:
    - cron: '0 5 * * 1-5'        # fallback only: skips itself if the Worker run already shipped today

# Never run two Dailies at once (Worker trigger + late GitHub schedule).
concurrency:
  group: sqwod-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # One Daily per day. Whichever trigger arrives second finds today's issue already
      # committed and stops here, so readers never get the email twice.
      - name: Already shipped today?
        id: guard
        run: |
          D=$(date +%F)
          if [ -f "site/src/content/daily/$D.en.md" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "Sqwod Daily $D already shipped (event: ${{ github.event_name }}). Nothing to do."
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ingest today's industry news (free, no key)
        id: ingest
        if: steps.guard.outputs.done != 'true'
        run: node automation/ingest.mjs

      - name: Rewrite in Sqwod voice (EN + DE)
        id: cascade
        if: steps.guard.outputs.done != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail   # keep a cascade crash a failure (the step would otherwise report tee's exit code)
          node automation/cascade.mjs --date=$(date +%F) --status=published 2>&1 | tee /tmp/cascade.log   # guardrail repairs/drops unverifiable items; the trust check below decides whether it ships on its own

      - name: Voice it — TTS audio + podcast feeds (EN + DE)
        id: audio
        if: steps.guard.outputs.done != 'true'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Voice ids are version-controlled in automation/audio.mjs (authoritative);
          # we no longer inject the VOICE_EN/DE secrets so the id logs unmasked.
        run: node automation/audio.mjs --date=$(date +%F)

      - name: Render the email (EN + DE, with sponsor slot)
        id: newsletter
        if: steps.guard.outputs.done != 'true'
        run: node automation/newsletter.mjs --date=$(date +%F)

      # Trust check (30 Oct 2026): a problem a reader could see holds the issue for Tee's
      # morning review email instead of sending it. Undecided by 10:00 Berlin, it goes out.
      - name: Trust check (hold if flagged)
        id: trust
        if: steps.guard.outputs.done != 'true'
        continue-on-error: true      # a crash here must never stop the Daily: no hold output = it sends as before
        run: |
          node automation/daily-trust.mjs --date=$(date +%F) --log=/tmp/cascade.log
          # A held issue is unpublished: rebuild the feeds without it.
          if grep -q '^status: "review"' "site/src/content/daily/$(date +%F).en.md" 2>/dev/null; then
            node automation/newsletter.mjs --date=$(date +%F)
            node automation/audio.mjs --feeds-only
          fi

      - name: Commit & push (if anything changed)
        id: commit
        if: steps.guard.outputs.done != 'true'
        run: |
          git config user.name "Sqwod Bot"
          git config user.email "bot@sqwod.life"
          # Only stage paths that actually exist — a missing optional folder
          # (e.g. automation/moves before any move is submitted) must never
          # fail the whole Daily with a git pathspec error (exit 128).
          for p in site/src/content automation/sources automation/covered-ledger.json automation/intel-queue automation/moves site/public/audio site/public/podcast.xml site/public/podcast.de.xml site/public/email site/public/email-assets site/public/daily-en.xml site/public/daily-de.xml; do
            [ -e "$p" ] && git add "$p"
          done
          if git diff --staged --quiet; then
            echo "No content changes."
          else
            git commit -m "content: Sqwod Daily $(date +%F)"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Send the Daily (Resend Broadcasts API)
        id: send
        if: steps.guard.outputs.done != 'true' && steps.trust.outputs.hold != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_EN: ${{ secrets.RESEND_AUDIENCE_EN }}
          RESEND_AUDIENCE_DE: ${{ secrets.RESEND_AUDIENCE_DE }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          RESEND_REPLY_TO: ${{ vars.RESEND_REPLY_TO }}
          RESEND_PRIMARY_LANG: ${{ vars.RESEND_PRIMARY_LANG }}
        run: node automation/send.mjs --date=$(date +%F)

      - name: Heartbeat — confirm today actually shipped
        if: always() && steps.guard.outputs.done != 'true'
        run: |
          D=$(date +%F)
          EN="site/src/content/daily/$D.en.md"
          if [ ! -f "$EN" ]; then
            echo "::error title=Sqwod Daily::No issue generated for $D (ingest empty or cascade failed). Nothing shipped."
            exit 0
          fi
          ST=$(grep -m1 '^status:' "$EN" | cut -d '"' -f2)
          if [ -f "site/public/audio/$D-en.mp3" ]; then AU="audio OK"; else AU="NO AUDIO"; fi
          if [ "$ST" != "published" ]; then
            echo "::warning title=Sqwod Daily::Issue for $D is held for review (status=$ST). It is in the 07:30 review email and goes out at 10:00 unless Tee decides. $AU"
          else
            echo "Sqwod Daily $D shipped: status=$ST · $AU"
          fi

      - name: Report which step failed (named alert)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if   [ "${{ steps.ingest.outcome }}"     = "failure" ]; then F="Ingest news (feeds down / network)";
          elif [ "${{ steps.cascade.outcome }}"    = "failure" ]; then F="Rewrite in Sqwod voice — cascade (check ANTHROPIC_API_KEY credit/validity)";
          elif [ "${{ steps.audio.outcome }}"      = "failure" ]; then F="Audio / TTS (check ELEVENLABS_API_KEY credit/validity)";
          elif [ "${{ steps.newsletter.outcome }}" = "failure" ]; then F="Render email (newsletter.mjs)";
          elif [ "${{ steps.commit.outcome }}"     = "failure" ]; then F="Commit & push (git)";
          elif [ "${{ steps.send.outcome }}"       = "failure" ]; then F="Send the Daily (check RESEND_API_KEY / audience IDs)";
          else F="Setup / checkout"; fi
          {
            echo "## ❌ Sqwod Daily failed"
            echo ""
            echo "**Failed step:** $F"
            echo ""
            echo "[Open the run and expand the red step]($URL)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Sqwod Daily failed at: $F::$URL"
          # Optional push alert via Resend (guarded — never fails the reporter)
          if [ -n "$RESEND_API_KEY" ] && [ -n "$RESEND_FROM" ]; then
            curl -s -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" \
              -d "{\"from\":\"$RESEND_FROM\",\"to\":\"tee@teemajor.com\",\"subject\":\"❌ Sqwod Daily failed: $F\",\"text\":\"The Daily workflow failed at step: $F\n\nOpen the run: $URL\"}" >/dev/null || true
          fi
